name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK and Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sudo chmod -R a+rwx "$ANDROID_SDK_ROOT" || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "build-tools;36.0.0" > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36" > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" > /dev/null 2>&1 || true
          fi

      - name: Prepare .env and debug.keystore
        run: |
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi
          if [ ! -f "app/.env.example" ]; then
            touch app/.env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f "app/.env" ]; then
            cp app/.env.example app/.env || touch app/.env
          fi
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || rm -f debug.keystore
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-sites-reader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
